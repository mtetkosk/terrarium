# Cloud daily job. Lives in the PRIVATE data repo as .github/workflows/daily.yml
# (this copy in the public code repo is the template). The data repo holds the
# warehouse as sorted CSVs in state/; each run restores it, runs `make daily`
# from the public code repo, and commits the updated state back.
#
# Secrets (data repo -> Settings -> Secrets and variables -> Actions):
#   THE_ODDS_API_KEY, KENPOM_EMAIL, KENPOM_PASSWORD, GOOGLE_SHEET_ID,
#   GOOGLE_SERVICE_ACCOUNT_JSON (the whole key file's contents)

name: daily

on:
  schedule:
    - cron: "30 13 * * *"        # 13:30 UTC = 8:30 AM EST (9:30 AM EDT); GitHub may start it a few minutes late
  workflow_dispatch:              # "Run workflow" button for manual runs

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write                 # push the updated state back to this repo

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out saved state (this repo)
        uses: actions/checkout@v4
        with:
          path: data-repo

      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: mtetkosk/terrarium
          ref: main
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/v2/requirements.txt

      - name: Install and restore the warehouse
        id: restore
        working-directory: code/v2
        run: |
          make setup
          .venv/bin/python cli.py state import ../../data-repo/state

      - name: Run the daily job
        working-directory: code/v2
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_account.json"
          export GOOGLE_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/service_account.json"
          make daily

      # Save even if a later step failed (e.g. publish blocked): locked picks must persist.
      - name: Save the warehouse
        if: always() && steps.restore.outcome == 'success'
        working-directory: code/v2
        run: |
          .venv/bin/python cli.py state export ../../data-repo/state
          cd ../../data-repo
          git config user.name "terrarium-bot"
          git config user.email "terrarium-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -q -m "state $(date -u +%Y-%m-%d)"
          git push
